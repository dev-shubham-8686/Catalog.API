# PLACEHOLDER VALUES — replace before any real deployment. Do not commit real secrets to source
# control; in production, generate this via a secret manager (Sealed Secrets, External Secrets
# Operator, Vault, cloud KMS, etc.) instead of a plain committed manifest like this demo one.
#
# `stringData` lets you write plaintext here; Kubernetes base64-encodes it into `data` for you.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: catalog
type: Opaque
stringData:
  # Shared with sqlserver.yaml's MSSQL_SA_PASSWORD so the app's connection string and the DB's
  # actual SA password always match.
  MSSQL_SA_PASSWORD: "P@ssw0rd_ReplaceMe"
  DataSource__ConnectionString: "Server=sqlserver,1433;Database=Store;User Id=sa;Password=P@ssw0rd_ReplaceMe;TrustServerCertificate=True;"

  EventBus__User: "guest"
  EventBus__Password: "guest"

  Jwt__Key: "ReplaceThisWithASecretGeneratedPerEnvironment"
