# Self-contained demo only — real production should use a managed RabbitMQ service (e.g.
# CloudAMQP) or a properly-clustered RabbitMQ operator deployment, not a single replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: EventBus__User
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: EventBus__Password
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            # rabbitmq-diagnostics ping talks to the Erlang node over distribution protocol and
            # routinely takes longer than the 1s default probe timeout — without an explicit
            # timeoutSeconds this fails forever even once RabbitMQ is fully healthy.
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: catalog
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
